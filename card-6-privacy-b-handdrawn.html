<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../../../../brand/design-system/styles.css" />
<link rel="stylesheet" href="carousel-base.css" />
<style>
  .panel { gap: 56px; align-items: flex-start; padding-left: 84px; padding-right: 84px; }
  .item { display: flex; align-items: center; gap: 42px; width: 100%; }
  .mark { width: 116px; height: 116px; flex-shrink: 0; }
  .mark path, .mark circle, .mark rect, .mark line {
    fill: none; stroke: var(--ink); stroke-width: 4;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .mark .slash { stroke: var(--accent); stroke-width: 6; }
  .item .txt { font-family: var(--ff-display); font-size: 54px; line-height: 1.2; color: var(--ink); }
</style>
</head>
<body>
  <div class="brand-row">
    <div class="brand"><img src="../../../../../brand/scriblit-logo.png" alt="" /><span>Scriblit</span></div>
  </div>

  <div class="display headline">Your story stays<br><em>with you</em>.</div>

  <div class="panel">
    <div class="item">
      <svg class="mark" viewBox="0 0 100 100">
        <!-- little robot, drawn loose -->
        <path d="M30,38 C28,36 70,35 71,38 C73,44 72,68 70,71 C66,74 33,74 30,71 C28,67 28,42 30,38 Z"/>
        <path d="M50,35 C50,30 49,27 50,23"/><circle cx="50" cy="20" r="4"/>
        <circle cx="41" cy="52" r="4.5"/><circle cx="60" cy="52" r="4.5"/>
        <path d="M40,63 C46,66 55,66 61,63"/>
        <path d="M30,48 C25,48 22,50 21,54"/><path d="M71,48 C76,48 79,50 80,54"/>
        <path class="slash" d="M18,84 C40,72 62,56 84,20"/>
      </svg>
      <span class="txt">No AI. Ever.</span>
    </div>
    <div class="item">
      <svg class="mark" viewBox="0 0 100 100">
        <!-- an eye, drawn loose -->
        <path d="M12,50 C28,30 72,30 88,50 C72,70 28,70 12,50 Z"/>
        <circle cx="50" cy="50" r="12"/>
        <path class="slash" d="M16,82 C38,70 60,54 84,22"/>
      </svg>
      <span class="txt">We never see your work.</span>
    </div>
    <div class="item">
      <svg class="mark" viewBox="0 0 100 100">
        <!-- cloud with a check: opt-in, not banned -->
        <path d="M28,66 C18,66 13,58 17,50 C20,44 27,42 32,44 C34,32 46,26 56,31 C63,34 66,41 65,47 C74,45 82,51 82,58 C82,63 77,66 71,66 Z"/>
        <path class="slash" d="M38,78 L47,87 L66,68"/>
      </svg>
      <span class="txt">Cloud sync only if you ask.</span>
    </div>
  </div>

  <div class="foot">
    <div class="url">scriblitpb.com</div>
    <div class="swipe">
      <span class="cue">start writing</span>
      <svg class="hand-arrow" viewBox="0 0 72 28" width="86" height="34" fill="none">
        <path d="M2,15 C18,9 34,18 50,13" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
        <path d="M40,5 C46,9 52,12 58,14 C52,15 46,18 41,23" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</body>
</html>
