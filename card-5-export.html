<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../../../../brand/design-system/styles.css" />
<link rel="stylesheet" href="carousel-base.css" />
<style>
  /* The page runs off the bottom edge rather than shrinking to fit: a title page
     is mostly empty by nature, so fitting the whole sheet in frame makes the
     contact block unreadable on a phone. Bleeding it keeps the type large. */
  .panel { padding: 40px 0 0; justify-content: flex-start; overflow: hidden; }
  .panel img { width: 78%; height: auto; box-shadow: var(--shadow-card); flex-shrink: 0; }
</style>
</head>
<body>
  <div class="brand-row">
    <div class="brand"><img src="../../../../../brand/scriblit-logo.png" alt="" /><span>Scriblit</span></div>
  </div>

  <div class="display headline">Export<br><em>submission-ready</em><br>manuscripts.</div>

  <div class="panel">
    <img src="ref-title-page.png" alt="" />
  </div>

  <div class="foot">
    <div class="url">scriblitpb.com</div>
    <div class="swipe">
      <span class="cue">your work, your call</span>
      <svg class="hand-arrow" viewBox="0 0 72 28" width="86" height="34" fill="none">
        <path d="M2,15 C18,9 34,18 50,13" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
        <path d="M40,5 C46,9 52,12 58,14 C52,15 46,18 41,23" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</body>
</html>
