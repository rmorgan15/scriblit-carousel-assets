<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../../../../brand/design-system/styles.css" />
<link rel="stylesheet" href="carousel-base.css" />
<style>
  .panel { gap: 0; }
  .shot { box-shadow: var(--shadow-card); line-height: 0; }
  .shot img { display: block; width: 760px; height: auto; }
</style>
</head>
<body>
  <div class="brand-row">
    <div class="brand"><img src="../../../../../brand/scriblit-logo.png" alt="" /><span>Scriblit</span></div>
  </div>

  <div class="display headline">You should be <em>writing</em>, not doing math.</div>

  <div class="panel">
    <div class="shot"><img src="ref-word-count.png" alt="" /></div>
  </div>

  <div class="foot">
    <div class="url">scriblitpb.com</div>
    <div class="swipe">
      <span class="cue">sending it out</span>
      <svg class="hand-arrow" viewBox="0 0 72 28" width="86" height="34" fill="none">
        <path d="M2,15 C18,9 34,18 50,13" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
        <path d="M40,5 C46,9 52,12 58,14 C52,15 46,18 41,23" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</body>
</html>
