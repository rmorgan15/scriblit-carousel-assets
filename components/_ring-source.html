<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .cell { display: inline-block; }
  svg { display: block; overflow: visible; }
  .ring path {
    fill: none;
    stroke: #6B2FE3;
    stroke-width: 5;
    stroke-linecap: round;
  }
  .arrow path {
    fill: none;
    stroke: #6B2FE3;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>
<body>
  <div class="cell" id="ring">
    <svg class="ring" width="400" height="120" viewBox="0 0 200 60">
      <path d="M16,30 C20,8 80,4 140,6 C175,8 195,22 193,36 C191,52 145,58 96,57 C48,56 8,48 8,34 C8,20 55,8 100,10"/>
    </svg>
  </div>
  <div class="cell" id="arrow">
    <svg class="arrow" width="288" height="112" viewBox="0 0 72 28">
      <path d="M2,15 C18,9 34,18 50,13"/>
      <path d="M40,5 C46,9 52,12 58,14 C52,15 46,18 41,23"/>
    </svg>
  </div>
</body>
</html>
