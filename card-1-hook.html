<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../../../../brand/design-system/styles.css" />
<link rel="stylesheet" href="carousel-base.css" />
<style>
  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
  .headline { margin: 0; }
  /* The second half of the sentence is staggered so the ringed word sits clear. */
  .line-2 { display: block; margin-left: 132px; }
  .sentence-2 { display: block; margin-top: 0.7em; }
  /* The oval reaches ~24% of the word's width to the left; without this the
     arc cuts back into the preceding word. */
  .headline .ring { margin-left: 0.7em; }
</style>
</head>
<body>
  <div class="brand-row">
    <div class="brand"><img src="../../../../../brand/scriblit-logo.png" alt="" /><span>Scriblit</span></div>
  </div>

  <div class="stage">
    <div class="display headline">Your picture book<span class="line-2">isn't a <span style="white-space:nowrap"><span class="ring"><em>report</em><svg viewBox="0 0 200 60" preserveAspectRatio="none"><path d="M16,30 C20,8 80,4 140,6 C175,8 195,22 193,36 C191,52 145,58 96,57 C48,56 8,48 8,34 C8,20 55,8 100,10"/></svg></span>.</span></span><span class="sentence-2">So why write it like one?</span></div>
  </div>

  <div class="foot">
    <div class="url">scriblitpb.com</div>
    <div class="swipe">
      <span class="cue">see how</span>
      <svg class="hand-arrow" viewBox="0 0 72 28" width="86" height="34" fill="none">
        <path d="M2,15 C18,9 34,18 50,13" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
        <path d="M40,5 C46,9 52,12 58,14 C52,15 46,18 41,23" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</body>
</html>
